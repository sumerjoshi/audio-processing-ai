[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-processing-ai"
version = "0.1.0"
description = "A deep learning package for analyzing audio files and detecting AI-generated content"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Audio Processing AI Team"},
]
keywords = ["audio", "machine-learning", "ai-detection", "pytorch", "deep-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "torchlibrosa>=0.1.0",
    "librosa>=0.11.0",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "matplotlib>=3.9.4",
    "tqdm>=4.67.1",
    "soundfile>=0.13.1",
    "scikit-learn>=1.6.1",
    "torch-audiomentations>=0.11.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-all>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/audio-processing-ai"
Repository = "https://github.com/yourusername/audio-processing-ai"
Issues = "https://github.com/yourusername/audio-processing-ai/issues"

[project.scripts]
audio-train = "audio_processing_ai.train:main"
audio-predict = "audio_processing_ai.predict:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["audio_processing_ai"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
